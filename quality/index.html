<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rayza Mahendra — Portfolio</title>
<meta name="description" content="Rayza Mahendra: AI & Data Governance CoE Officer and ML Engineer at Telkomsel, Jakarta. An interactive, Persona-style portfolio.">
<meta name="theme-color" content="#020815">
<meta property="og:title" content="Rayza Mahendra — Portfolio">
<meta property="og:description" content="AI & Data Governance · LLMOps · GenAI · NLP. Walk the halls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,600;1,800;1,900&family=Barlow:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020815; --navy:#061a3a; --navy-2:#0a2a5e; --blue:#1158d6; --cyan:#41d2ff; --cyan-soft:#9be8ff;
  --white:#f3f8ff; --ink:#02102a; --muted:#8fa6c8; --accent:#ff3b6b; --gold:#ffd166;
  --disp:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,sans-serif;
  --panel-w:min(720px,54vw); --ease:cubic-bezier(.2,.9,.1,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--white);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body.no-gl{background:radial-gradient(120% 90% at 30% 20%,#0d3577 0,#061a3a 45%,#020815 100%)}
button{font:inherit;color:inherit}
a{color:var(--cyan-soft)}
kbd{font:700 11px/1 var(--body);padding:3px 6px;border:1px solid rgba(155,232,255,.5);border-radius:3px;color:var(--cyan-soft);background:rgba(65,210,255,.08)}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:manipulation}
.ui{position:fixed;z-index:5;pointer-events:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ---------- Date box (top-left) ---------- */
#datebox{top:22px;left:30px;transition:opacity .4s,transform .5s var(--ease)}
.db-row{display:flex;align-items:flex-end;gap:10px}
.db-date{font:italic 900 78px/.8 var(--disp);letter-spacing:-.02em;text-shadow:4px 4px 0 var(--blue),0 0 30px rgba(65,210,255,.45)}
.db-wd{font:italic 800 24px/1 var(--disp);background:var(--white);color:var(--ink);padding:4px 12px 3px;transform:rotate(-8deg) translateY(-30px);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.db-row2{display:flex;align-items:center;gap:12px;margin-top:12px}
#db-moon{width:42px;height:42px;filter:drop-shadow(0 0 8px rgba(155,232,255,.7))}
#db-moon .md{fill:#0b2350;stroke:rgba(155,232,255,.5);stroke-width:1.2}
#db-moon path{fill:#e9f6ff}
.db-tod{font:italic 800 26px/1 var(--disp);letter-spacing:.08em;color:var(--cyan)}
.db-tod.dh{color:#b8ff9c;text-shadow:0 0 14px rgba(160,255,120,.6)}
.db-phase{font:600 12px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* ---------- Nameplate (bottom-left) ---------- */
#nameplate{left:30px;bottom:30px;transition:opacity .4s,transform .5s var(--ease)}
.np-lv{display:inline-flex;align-items:baseline;gap:6px;font:italic 800 16px/1 var(--disp);letter-spacing:.14em;color:var(--ink);background:var(--cyan);padding:5px 12px 4px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.np-lv b{font-size:22px;letter-spacing:0}
.np-name{margin:8px 0 0;font:italic 900 clamp(46px,5.4vw,84px)/.84 var(--disp);letter-spacing:-.01em;transform:skewX(-6deg);text-shadow:4px 4px 0 var(--blue),0 0 34px rgba(65,210,255,.35)}
.np-role{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px}
.np-role span{font:italic 800 17px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;background:var(--white);color:var(--ink);padding:5px 12px 4px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.np-role span+span{background:transparent;color:var(--cyan-soft);padding-left:2px;font-size:15px}

/* ---------- Top bar ---------- */
#topbar{top:20px;right:26px;display:flex;gap:8px}
#topbar button{pointer-events:auto;cursor:pointer;background:rgba(3,16,40,.7);border:1px solid rgba(65,210,255,.45);color:var(--cyan-soft);font:italic 800 14px/1 var(--disp);letter-spacing:.14em;padding:8px 12px 7px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#topbar button:hover{background:var(--white);color:var(--ink)}

/* ---------- Main menu ---------- */
#menu{right:clamp(20px,5vw,90px);top:50%;transform:translateY(-50%);transition:transform .55s var(--ease),opacity .4s}
#menu ul{list-style:none;margin:0;padding:0;transform:rotate(-7deg);display:flex;flex-direction:column;align-items:flex-end}
#menu li{margin:-3px 0;transform:translateX(calc(var(--x,0px) + 90px));opacity:0;transition:transform .7s var(--ease),opacity .5s;transition-delay:calc(var(--i)*55ms)}
body.ready #menu li{transform:translateX(var(--x,0px));opacity:1}
.mi{pointer-events:auto;position:relative;display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:2px 18px 0 24px;cursor:pointer;color:var(--white);font:italic 900 clamp(38px,4.5vw,70px)/.95 var(--disp);letter-spacing:-.005em;text-transform:uppercase;transition:color .12s,transform .22s var(--ease);text-shadow:0 3px 0 rgba(3,14,40,.9),0 0 24px rgba(65,210,255,.35);white-space:nowrap}
.mi .w{position:relative;z-index:2;display:inline-block}
.mi .sub{position:relative;z-index:2;font:700 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-style:normal;opacity:0;transform:translateX(-8px);transition:.2s;text-shadow:none}
.mi::before{content:"";position:absolute;z-index:1;left:0;right:0;top:8%;bottom:4%;background:var(--white);clip-path:polygon(3% 10%,100% 0,97% 100%,0 86%);transform:scaleX(0);transform-origin:right;transition:transform .16s var(--ease)}
.mi::after{content:"";position:absolute;z-index:0;left:-10px;right:12px;top:24%;bottom:-10%;background:var(--cyan);clip-path:polygon(0 14%,100% 0,98% 92%,3% 100%);transform:scaleX(0);transform-origin:right;transition:transform .22s .04s var(--ease)}
.mi.sel{color:var(--ink);text-shadow:none;transform:scale(1.07) rotate(1.5deg)}
.mi.sel::before,.mi.sel::after{transform:scaleX(1)}
.mi.sel .sub{opacity:1;transform:none}
.mi.sel .w{animation:jit 1.4s steps(2) infinite}
.mi.sel .w::before{content:"";position:absolute;left:-30px;top:50%;width:16px;height:24px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%);transform:translateY(-50%);filter:drop-shadow(0 0 6px rgba(255,59,107,.8))}
.mi:focus-visible{outline:none}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(.6px,-.6px)}50%{transform:translate(-.6px,.4px)}75%{transform:translate(.4px,.6px)}}
@media (min-width:761px){
  body.in-sec #menu{transform:translateY(-50%) translateX(14px) scale(.54);transform-origin:right center}
}
body.in-sec #datebox{opacity:0;transform:translateY(-20px)}
body.in-sec #nameplate{opacity:0;transform:translateX(-30px)}

/* ---------- Hints ---------- */
#hints{right:28px;bottom:22px;display:flex;gap:16px;align-items:center;font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#hints span{display:flex;gap:5px;align-items:center}
#hints .credit{opacity:.7;letter-spacing:.06em;text-transform:none}

/* ---------- Tooltip ---------- */
#tip{left:0;top:0;padding:6px 12px 5px;background:var(--white);color:var(--ink);font:italic 800 16px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);opacity:0;transition:opacity .12s;z-index:8;white-space:nowrap}
#tip.on{opacity:1}
#tip small{font:700 11px var(--body);letter-spacing:.16em;color:var(--blue);margin-left:6px;font-style:normal}

/* ---------- Panel ---------- */
#panel{left:0;top:0;bottom:0;width:var(--panel-w);transform:translateX(-108%);transition:transform .55s var(--ease);z-index:6}
body.in-sec #panel{transform:none;pointer-events:auto}
#panel::before{content:"";position:absolute;inset:0 -22px 0 0;background:rgba(65,210,255,.16);clip-path:polygon(0 0,100% 0,calc(100% - 90px) 100%,0 100%);pointer-events:none}
.pn-bg{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,calc(100% - 90px) 100%,0 100%);background:
  radial-gradient(circle at 1px 1px,rgba(65,210,255,.12) 1px,transparent 1.6px) 0 0/7px 7px,
  linear-gradient(160deg,rgba(12,46,104,.95),rgba(3,14,36,.96) 58%,rgba(2,8,21,.98))}
.pn-bg::after{content:"";position:absolute;inset:0;background:var(--cyan);clip-path:polygon(calc(100% - 5px) 0,100% 0,calc(100% - 90px) 100%,calc(100% - 95px) 100%)}
.pn-inner{position:relative;height:100%;display:flex;flex-direction:column;padding:26px 118px 0 44px}
.pn-head{position:relative;flex:none}
.pn-ghost{position:absolute;top:-34px;left:-26px;font:italic 900 190px/.8 var(--disp);color:transparent;-webkit-text-stroke:1.5px rgba(65,210,255,.2);white-space:nowrap;pointer-events:none;transform:rotate(-5deg);user-select:none}
.pn-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
.pn-back{cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:rgba(3,16,40,.6);border:1px solid rgba(65,210,255,.45);color:var(--cyan-soft);font:italic 800 15px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:8px 14px 7px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.pn-back:hover{background:var(--white);color:var(--ink)}
.pn-nav{display:flex;gap:6px}
.pn-nav button{cursor:pointer;width:40px;height:34px;background:rgba(3,16,40,.6);border:1px solid rgba(65,210,255,.45);color:var(--cyan-soft);font:900 15px/1 var(--disp);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.pn-nav button:hover{background:var(--white);color:var(--ink)}
.pn-title{margin:30px 0 0;font:italic 900 clamp(54px,6vw,92px)/.85 var(--disp);letter-spacing:-.01em;text-shadow:5px 5px 0 var(--blue),0 0 32px rgba(65,210,255,.45);transform:rotate(-3deg);transform-origin:left;outline:none}
.pn-sub{display:inline-block;margin-top:12px;background:var(--white);color:var(--ink);font:italic 800 17px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;padding:6px 16px 5px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.pn-body{flex:1;overflow-y:auto;padding:20px 10px 70px 2px;margin-top:12px;scrollbar-width:thin;scrollbar-color:var(--cyan) transparent;-webkit-mask-image:linear-gradient(transparent 0,#000 16px,#000 calc(100% - 50px),transparent);mask-image:linear-gradient(transparent 0,#000 16px,#000 calc(100% - 50px),transparent);outline:none}
.pn-body.anim>*{animation:inR .55s var(--ease) both;animation-delay:calc(var(--d,0)*50ms + 140ms)}
@keyframes inR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.pn-head.anim .pn-title{animation:inT .5s var(--ease) both}
@keyframes inT{from{opacity:0;transform:rotate(-3deg) translateX(-40px) skewX(-12deg)}to{opacity:1;transform:rotate(-3deg)}}

/* ---------- Panel content ---------- */
.h3{font:italic 800 15px/1 var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin:6px 0 12px;display:flex;align-items:center;gap:10px}
.h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(65,210,255,.6),transparent)}
.pn-body p{line-height:1.6;color:#d6e4f8;margin:0 0 12px;font-size:15.5px}
.lead{font-size:17px!important;color:#eaf3ff!important}
.card{position:relative;background:linear-gradient(100deg,rgba(13,44,98,.75),rgba(4,16,40,.72));border-left:3px solid var(--cyan);padding:15px 18px;margin:0 0 14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.card.active{border-left-color:var(--accent);background:linear-gradient(100deg,rgba(24,62,132,.85),rgba(6,22,54,.8))}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h4{margin:0;font:italic 800 24px/1.05 var(--disp);letter-spacing:.01em}
.org{font:600 12.5px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan-soft);margin-top:5px}
.date{flex:none;font:italic 800 14px/1 var(--disp);letter-spacing:.06em;background:var(--white);color:var(--ink);padding:5px 10px 4px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);white-space:nowrap}
.card ul{margin:10px 0 0;padding:0 0 0 18px}
.card li{margin:5px 0;line-height:1.5;color:#cfe0f6;font-size:14.5px}
.card li::marker{color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font:600 12px/1 var(--body);letter-spacing:.04em;padding:6px 10px;border:1px solid rgba(65,210,255,.4);background:rgba(65,210,255,.07);color:#e2f6ff;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.tagx{display:inline-block;font:italic 800 12px/1 var(--disp);letter-spacing:.16em;padding:4px 8px 3px;background:var(--accent);color:#fff;margin-left:8px;vertical-align:middle;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.tagx.gold{background:var(--gold);color:var(--ink)}
.tagx.cy{background:var(--cyan);color:var(--ink)}
.card:has(>.arc){padding-left:80px}
.arc{position:absolute;left:18px;top:16px;width:44px;height:60px;display:grid;place-items:center;border:2px solid rgba(155,232,255,.7);font:italic 900 19px/1 var(--disp);color:var(--cyan-soft);transform:skewX(-8deg);background:rgba(65,210,255,.06)}
.card.active .arc{border-color:var(--accent);color:#fff;background:rgba(255,59,107,.18)}

/* status */
.st-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:16px}
.st-lv{width:92px;height:92px;display:grid;place-items:center;align-content:center;background:var(--white);color:var(--ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.st-lv small{font:italic 800 14px/1 var(--disp);letter-spacing:.2em;color:var(--blue)}
.st-lv b{font:italic 900 46px/.85 var(--disp)}
.st-name{font:italic 900 34px/1 var(--disp)}
.st-class{font:italic 800 18px/1.2 var(--disp);color:var(--cyan);letter-spacing:.04em;margin-top:4px}
.st-meta{font:600 12.5px/1.4 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.st-arc{grid-column:1/-1;display:flex;gap:10px;align-items:center;font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.st-arc b{font:italic 800 18px var(--disp);letter-spacing:.06em;color:var(--white);text-transform:none}
.stats{display:grid;gap:9px;margin-bottom:22px}
.stat{display:grid;grid-template-columns:112px 1fr 44px;gap:12px;align-items:center}
.stat .k{font:italic 800 18px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.stat .bar{height:14px;background:rgba(3,16,40,.9);border:1px solid rgba(65,210,255,.35);transform:skewX(-20deg);overflow:hidden;position:relative}
.stat .bar i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--cyan) 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);transform-origin:left;animation:fill 1s var(--ease) both;animation-delay:calc(var(--d,0)*50ms + 300ms)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stat .v{font:italic 900 15px/1 var(--disp);color:var(--gold);letter-spacing:.08em}
.stat .e{grid-column:2/-1;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:-4px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.facts div{background:rgba(3,16,40,.75);padding:10px 14px;border-left:2px solid rgba(65,210,255,.6)}
.facts dt{font:600 11px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:3px 0 0;font:italic 800 18px/1.15 var(--disp)}

/* skill */
.sk-group{margin-bottom:18px}
.sk-head{display:flex;align-items:center;gap:10px;font:italic 800 20px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;background:linear-gradient(90deg,rgba(65,210,255,.2),transparent);border-left:3px solid var(--c)}
.sk-head svg{width:20px;height:20px;color:var(--c);flex:none}
.sk-head .n{margin-left:auto;font:600 11px var(--body);color:var(--muted);letter-spacing:.16em}
.sk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.sk{display:flex;align-items:center;gap:9px;padding:9px 12px;background:rgba(3,16,40,.8);font:600 14px/1.2 var(--body);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:background .12s,color .12s}
.sk::before{content:"";width:7px;height:7px;background:var(--c);transform:rotate(45deg);flex:none}
.sk:hover{background:var(--white);color:var(--ink)}

/* item */
details.it{margin-bottom:8px;background:rgba(3,16,40,.8);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
details.it summary{list-style:none;display:flex;align-items:center;gap:14px;padding:11px 16px;cursor:pointer;transition:background .12s}
details.it summary::-webkit-details-marker{display:none}
details.it summary:hover{background:rgba(65,210,255,.12)}
.it-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--c,var(--cyan));color:var(--ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);font:italic 900 13px/1 var(--disp)}
.it-name{font:italic 800 21px/1.05 var(--disp)}
.it-org{font:600 11.5px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.it-yr{margin-left:auto;font:italic 800 17px/1 var(--disp);color:var(--cyan-soft);flex:none}
details.it[open] summary{background:var(--white);color:var(--ink)}
details.it[open] .it-org{color:#3a5a88}
details.it[open] .it-yr{color:var(--blue)}
.it-body{padding:12px 18px 16px 64px}
.it-body p{font-size:14.5px!important;margin-bottom:6px!important}
.it-body a{font:italic 800 15px var(--disp);letter-spacing:.08em;text-transform:uppercase}
.it-sub{font:italic 800 14px/1 var(--disp);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:16px 0 8px}

/* quest */
.qs{padding-right:120px}
.qs .k{font:600 11.5px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan-soft)}
.qs h4{margin:6px 0 4px}
.qs p{margin:0!important;font-size:14.5px!important}
.stamp{position:absolute;right:16px;top:50%;font:italic 900 17px/1 var(--disp);letter-spacing:.14em;color:var(--cyan);border:2px solid currentColor;padding:7px 10px 6px;transform:translateY(-50%) rotate(9deg);text-align:center}
.stamp.win{color:var(--gold);box-shadow:0 0 18px rgba(255,209,102,.25)}
.stamp.fin{color:var(--cyan-soft)}

/* equip */
.eq{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start}
.eq-slot{font:italic 800 14px/1 var(--disp);letter-spacing:.18em;background:var(--cyan);color:var(--ink);padding:7px 8px 6px;text-align:center;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.eq-slot small{display:block;font:600 10px var(--body);letter-spacing:.14em;margin-top:4px;color:var(--navy-2)}
.eq .chips{margin-top:9px}

/* social */
.contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px}
a.ct{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(3,16,40,.82);text-decoration:none;color:var(--white);border-left:3px solid var(--cyan);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);transition:background .12s,color .12s}
a.ct:hover,a.ct:focus-visible{background:var(--white);color:var(--ink)}
a.ct svg{width:26px;height:26px;flex:none;color:var(--cyan)}
a.ct:hover svg{color:var(--blue)}
a.ct b{display:block;font:italic 800 20px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
a.ct span{display:block;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.ct:hover span{color:#3a5a88}
.bond{display:flex;gap:16px;align-items:center;padding:12px 16px;margin-bottom:8px;background:rgba(3,16,40,.78);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.bond .tc{width:40px;height:56px;flex:none;display:grid;place-items:center;border:2px solid rgba(155,232,255,.7);transform:skewX(-8deg);color:var(--cyan)}
.bond .tc svg{width:20px;height:20px;transform:skewX(8deg)}
.bond b{display:block;font:italic 800 19px/1.1 var(--disp)}
.bond span{font:500 13.5px/1.35 var(--body);color:var(--muted)}

/* system */
.sys-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;margin-bottom:8px;background:rgba(3,16,40,.8);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.sys-row .l b{display:block;font:italic 800 21px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.sys-row .l span{font:500 13px/1.35 var(--body);color:var(--muted)}
button.tg{cursor:pointer;flex:none;min-width:104px;background:none;border:1px solid rgba(65,210,255,.45);color:var(--muted);font:italic 800 17px/1 var(--disp);letter-spacing:.12em;padding:8px 10px 7px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
button.tg[aria-pressed="true"]{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
button.tg:hover{background:var(--white);color:var(--ink)}
.cta{display:inline-flex;gap:12px;align-items:center;margin:4px 0 22px;padding:14px 28px 13px;background:var(--white);color:var(--ink)!important;font:italic 900 26px/1 var(--disp);letter-spacing:.04em;text-decoration:none;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:background .12s}
.cta:hover{background:var(--cyan)}
.cta svg{width:22px;height:22px}
.fine{font:500 12.5px/1.6 var(--body)!important;color:var(--muted)!important}

/* ---------- Wipe + boot ---------- */
#wipe{position:fixed;top:-20%;bottom:-20%;left:-60%;right:-60%;z-index:40;pointer-events:none;background:linear-gradient(90deg,transparent 0 34%,var(--blue) 34% 38%,var(--cyan) 38% 43%,var(--white) 43% 52%,var(--cyan) 52% 54%,transparent 54%);transform:translateX(-100%) skewX(-22deg);visibility:hidden}
#wipe.go{visibility:visible;animation:wipe .52s cubic-bezier(.65,0,.3,1) both}
@keyframes wipe{from{transform:translateX(-100%) skewX(-22deg)}to{transform:translateX(100%) skewX(-22deg)}}
#boot{position:fixed;inset:0;z-index:50;background:#01040b;display:grid;place-items:center;transition:clip-path .8s cubic-bezier(.7,0,.2,1);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
#boot.done{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}
.bt{text-align:center}
.bt-name{font:italic 900 clamp(44px,8vw,96px)/.9 var(--disp);letter-spacing:-.01em;text-shadow:5px 5px 0 var(--blue),0 0 40px rgba(65,210,255,.5);animation:btIn .9s var(--ease) both}
@keyframes btIn{from{opacity:0;transform:translateY(16px) skewX(-14deg)}to{opacity:1;transform:none}}
.bt-line{height:3px;width:min(420px,70vw);margin:20px auto 12px;background:rgba(65,210,255,.18);position:relative;overflow:hidden;transform:skewX(-30deg)}
.bt-line i{position:absolute;inset:0;background:var(--cyan);transform-origin:left;transform:scaleX(0);transition:transform .3s}
.bt-sub{font:700 12px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}

/* ---- Sound (synthesized, no files) ---- */
const Sfx = {
  ctx:null,
  unlock(){ if (this.ctx) { if (this.ctx.state==='suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} },
  tone(f, dur=.06, type='triangle', vol=.05, slide=0, delay=0){
    if (!prefs.sfx || !this.ctx || this.ctx.state!=='running') return;
    const c=this.ctx, t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if (slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.03);
  },
  noise(dur=.35, vol=.05, f0=500, f1=3000){
    if (!prefs.sfx || !this.ctx || this.ctx.state!=='running') return;
    const c=this.ctx, t=c.currentTime, len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
    s.buffer=buf; bp.type='bandpass'; bp.Q.value=1.4; bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t); s.connect(bp).connect(g).connect(c.destination); s.start(t);
  },
  move(){ this.tone(1480,.04,'triangle',.045); },
  select(){ this.tone(740,.07,'square',.03,1.9); this.tone(1480,.12,'triangle',.04,0,.06); this.noise(.3,.035,600,4000); },
  back(){ this.tone(900,.1,'triangle',.05,.5); },
};

/* ---- Date / moon HUD ---- */
function moonInfo(d){
  const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14);
  const age=(((d-ref)/864e5)%syn+syn)%syn, p=age/syn;
  const names=[[.0339,'New moon'],[.216,'Waxing crescent'],[.284,'First quarter'],[.466,'Waxing gibbous'],[.534,'Full moon'],[.716,'Waning gibbous'],[.784,'Last quarter'],[.966,'Waning crescent'],[1.01,'New moon']];
  const name=names.find(n=>p<n[0])[1];
  const toFull=((syn/2-age)%syn+syn)%syn;
  return { p, name, toFull: Math.round(toFull) };
}
function moonPath(p, r=20){
  const k=Math.cos(2*Math.PI*p), rx=Math.max(.01,Math.abs(k)*r), wax=p<.5;
  const outer=wax?1:0, term= wax ? (k>0?0:1) : (k>0?1:0);
  return `M0,${-r} A${r},${r} 0 0 ${outer} 0,${r} A${rx},${r} 0 0 ${term} 0,${-r}Z`;
}
function todLabel(h){
  if (h===0) return 'Dark Hour';
  if (h<5) return 'Late Night'; if (h<8) return 'Early Morning'; if (h<12) return 'Morning';
  if (h<13) return 'Lunchtime'; if (h<15) return 'Afternoon'; if (h<18) return 'After School'; return 'Evening';
}
function updateClock(){
  const d=new Date(), m=moonInfo(d);
  $('#db-date').textContent = `${d.getMonth()+1}/${d.getDate()}`;
  $('#db-wd').textContent = d.toLocaleDateString('en-US',{weekday:'short'});
  const tod = darkOn ? 'Dark Hour' : todLabel(d.getHours());
  const el=$('#db-tod'); el.textContent=tod; el.classList.toggle('dh', tod==='Dark Hour');
  $('#db-phase').textContent = m.name==='Full moon' ? 'Full moon tonight' : `${m.name} · full in ${m.toFull}d`;
  $('#db-moon-lit').setAttribute('d', moonPath(m.p));
}

const panel=$('#panel'), pBody=$('#panel-body');
function wipe(){ const w=$('#wipe'); w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }
function renderPanel(s){
  const T=s.label.toUpperCase();
  $('#panel-title').textContent=T; $('#panel-ghost').textContent=T; $('#panel-sub').textContent=s.tagline;
  pBody.innerHTML=RENDER[s.id](); pBody.scrollTop=0;

  pBody.querySelectorAll('.stat').forEach((c,i)=>c.style.setProperty('--d',i));

  for (const el of [pBody, head]) { el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim'); }
  if (s.id==='system') wireSystem();
}
function openSection(id, {fromHash=false}={}){
  const i=SECTIONS.findIndex(s=>s.id===id); if (i<0) return;
  const changing = current!==id;
  current=id; sel=i; markSel();
  body.classList.add('in-sec'); panel.setAttribute('aria-hidden','false');
  if (changing){ renderPanel(SECTIONS[i]); wipe(); Sfx.select(); world?.goTo(id); }
  if (!fromHash) history.replaceState(null,'','#'+id);
  setTimeout(()=>pBody.focus({preventScroll:true}), 60);
}
function closeSection(){
  if (!current) return;
  current=null; body.classList.remove('in-sec'); panel.setAttribute('aria-hidden','true');
  markSel(); Sfx.back(); world?.goTo('home');
  history.replaceState(null,'',location.pathname+location.search);
  btns[sel].focus({preventScroll:true});
}
const step = d => openSection(SECTIONS[(sel+d+SECTIONS.length)%SECTIONS.length].id);

function setToggle(b,on){ b.setAttribute('aria-pressed', on); b.textContent = on ? 'ON' : 'OFF'; }
function wireSystem(){
  const s=$('#tg-sfx'), f=$('#tg-fx'), d=$('#tg-dark');
  setToggle(s,prefs.sfx); setToggle(f,prefs.fx); setToggle(d,darkOn);
  s.onclick=()=>{ prefs.sfx=!prefs.sfx; savePrefs(); setToggle(s,prefs.sfx); syncSfxBtn(); Sfx.move(); };
  f.onclick=()=>{ prefs.fx=!prefs.fx; savePrefs(); setToggle(f,prefs.fx); world?.setFx(prefs.fx); Sfx.move(); };
  d.onclick=()=>{ darkOn=!darkOn; prefs.dark=darkOn; savePrefs(); setToggle(d,darkOn); world?.setDark(darkOn); updateClock(); Sfx.select(); };
  if (!world){ f.disabled=true; d.disabled=true; }
}

/* ---- Keyboard ---- */
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k=e.key;
  if (!current){
    if (k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); select(sel+1,true); }
    else if (k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); select(sel-1,true); }
    else if (k==='Enter' && document.activeElement?.tagName!=='BUTTON'){ e.preventDefault(); openSection(SECTIONS[sel].id); }
  } else {
    if (k==='Escape'){ e.preventDefault(); closeSection(); }
    else if (k==='Backspace' && !e.target.closest('input,textarea')){ e.preventDefault(); closeSection(); }
    else if (k==='ArrowRight'||k==='e'||k==='E'){ e.preventDefault(); step(1); }
    else if (k==='ArrowLeft'||k==='q'||k==='Q'){ e.preventDefault(); step(-1); }
  }
});
addEventListener('hashchange', () => { const id=location.hash.slice(1); if (SECTIONS.some(s=>s.id===id)) openSection(id,{fromHash:true}); else closeSection(); });

/* =========================================================================
   WORLD  (three.js school hallway)
   ========================================================================= */
async function initWorld(progress){
  const THREE = await import('three');
  const [{EffectComposer},{RenderPass},{UnrealBloomPass},{ShaderPass},{OutputPass},{Reflector},{mergeGeometries}] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/ShaderPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
    import('three/addons/objects/Reflector.js'),
    import('three/addons/utils/BufferGeometryUtils.js'),
  ]);
  progress(.35);

  const V=(x,y,z)=>new THREE.Vector3(x,y,z), UP=V(0,1,0);
  const mobile=isMobile();
  let W=innerWidth, H=innerHeight;
  const DPR=Math.min(devicePixelRatio||1, mobile?1.5:2);

  // seeded random so the hallway looks the same every visit
  let seed=20231;
  const R=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const rr=(a,b)=>a+(b-a)*R();

  const canvas=$('#gl');
  const renderer=new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(DPR); renderer.setSize(W,H,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.25;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const maxAniso=renderer.capabilities.getMaxAnisotropy();

  const scene=new THREE.Scene();
  const FOG_N=new THREE.Color(0x06142c), FOG_D=new THREE.Color(0x07160c);
  scene.fog=new THREE.FogExp2(FOG_N.clone(), 0.016);
  scene.background=new THREE.Color(0x01040b);
  const camera=new THREE.PerspectiveCamera(W<H?68:52, W/H, 0.05, 1500);

  /* ---------- helpers ---------- */
  function ctex(w,h,draw,{srgb=true,repeat=null}={}){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'); draw(g,w,h);
    const t=new THREE.CanvasTexture(c); if (srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=maxAniso;
    if (repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
    return t;
  }
  const STATIC=new Map(); // material -> [geometries]  (merged at the end)
  function S(mat,x0,x1,y0,y1,z0,z1){
    const g=new THREE.BoxGeometry(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0));
    g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
    if (!STATIC.has(mat)) STATIC.set(mat,[]); STATIC.get(mat).push(g);
  }
  function SG(mat,geo){ if (!STATIC.has(mat)) STATIC.set(mat,[]); STATIC.get(mat).push(geo); }
  const std=(o)=>new THREE.MeshStandardMaterial(o);
  function fitFont(g,text,maxW,size,weight='italic 900',fam='"Barlow Condensed"'){
    let s=size; g.font=`${weight} ${s}px ${fam}`; while (g.measureText(text).width>maxW && s>10){ s-=2; g.font=`${weight} ${s}px ${fam}`; }
  }

  /* ---------- layout constants ---------- */
  const HW=2.9, CH=3.4, Z0=10, Z1=-64;
  const ROOM_Z=[-8,-18,-28,-38,-48];
  const ROOM_SEC=['persona','skill','item','quest','equip'];
  const ROOM_NUM=['2-A','2-B','2-C','2-D','2-E'];
  const WIN=[]; for (let i=0;i<22;i++) WIN.push(6.6-3.2*i);
  const SILL=.95, HEAD=2.65, WHW=1.05;
  const DW=.8, DH=2.25;
  const moonDir=V(-1,.45,-.38).normalize();
  const L=moonDir.clone().negate();

  /* ---------- textures ---------- */
  const tileTex=ctex(512,512,(g)=>{
    const cols=['#b9c5da','#a4b1c8'];
    for (let y=0;y<2;y++) for (let x=0;x<2;x++){ g.fillStyle=cols[(x+y)%2]; g.fillRect(x*256,y*256,256,256);
      for (let k=0;k<500;k++){ const v=90+Math.random()*80|0; g.fillStyle=`rgba(${v},${v+8},${v+25},.10)`; g.fillRect(x*256+Math.random()*256,y*256+Math.random()*256,2,2); } }
    g.strokeStyle='rgba(28,38,60,.6)'; g.lineWidth=5;
    for (let i=0;i<=2;i++){ g.beginPath(); g.moveTo(i*256,0); g.lineTo(i*256,512); g.stroke(); g.beginPath(); g.moveTo(0,i*256); g.lineTo(512,i*256); g.stroke(); }
  },{repeat:[HW,(Z0-Z1)/2]});
  const woodTex=ctex(512,512,(g)=>{
    for (let i=0;i<8;i++){ const v=rr(.85,1.1); g.fillStyle=`rgb(${120*v|0},${88*v|0},${60*v|0})`; g.fillRect(0,i*64,512,64);
      for (let k=0;k<40;k++){ g.strokeStyle=`rgba(40,25,15,${rr(.05,.15)})`; g.beginPath(); const y=i*64+rr(4,60); g.moveTo(0,y); g.bezierCurveTo(170,y+rr(-4,4),340,y+rr(-4,4),512,y); g.stroke(); }
      g.fillStyle='rgba(20,12,6,.6)'; g.fillRect(0,i*64,512,2); g.fillRect(rr(0,512),i*64,2,64); }
  },{repeat:[4,4]});
  const doorTex=ctex(256,512,(g,w,h)=>{
    g.fillStyle='#c8cdbf'; g.fillRect(0,0,w,h);
    g.strokeStyle='#7d8378'; g.lineWidth=14; g.strokeRect(7,7,w-14,h-14);
    g.fillStyle='#1a2b48'; g.fillRect(44,56,168,170);
    g.strokeStyle='#7d8378'; g.lineWidth=6; g.beginPath(); g.moveTo(128,56); g.lineTo(128,226); g.stroke();
    g.fillStyle='#6a7066'; g.fillRect(206,270,18,70);
    g.strokeStyle='rgba(90,96,86,.6)'; g.lineWidth=3; g.strokeRect(44,270,150,190);
  });
  const doorGlow=ctex(256,512,(g,w,h)=>{ g.fillStyle='#000'; g.fillRect(0,0,w,h); g.fillStyle='#fff'; g.fillRect(44,56,168,170); },{srgb:false});
  const lockerTex=ctex(128,256,(g,w,h)=>{

    pq.setFromEuler(eul.set(-ptr.y*.03+Math.sin(time*.5)*.003,-ptr.x*.055,0));
    camera.quaternion.copy(cur.quat).multiply(pq);
    const [sx,sy]=targetShift(); const k=Math.min(1,dt*5); vo.x+=(sx-vo.x)*k; vo.y+=(sy-vo.y)*k;
    camera.setViewOffset(W,H,-vo.x,-vo.y,W,H);

    // rooms
    for (const r of rooms){
      r.open+=(r.openT-r.open)*Math.min(1,dt*(r.openT?4:6)); r.door.position.z=r.d+1.6*r.open;
      if (r.flicker>0){ r.flicker-=dt; r.lit=Math.random()<.45?1:.06; if (r.flicker<=0) r.lit=1; }
      else r.lit+=(r.litT-r.lit)*Math.min(1,dt*3);
      r.light.intensity=2+r.lit*32;
      r.fixMat.emissiveIntensity=.08+r.lit*2.2;
      r.doorMat.emissiveIntensity=.1+r.lit*1.6+r.hover*.6;
      r.boardMat.emissiveIntensity=.06+r.lit*.22;
      r.hover+=((hoverSec===r.sec?1:0)-r.hover)*Math.min(1,dt*8);
      r.signMat.emissiveIntensity=.5+(r.litT?1.3:0)+r.hover*1.4;
    }
    for (const c of chars){
      c.mesh.rotation.y=Math.atan2(camera.position.x-c.mesh.position.x,camera.position.z-c.mesh.position.z);
      c.mat.uniforms.time.value=time; const tg=(hoverSec===c.sec?1.8:1)+(viewId===c.sec?.5:0); c.mat.uniforms.glow.value+=(tg-c.mat.uniforms.glow.value)*Math.min(1,dt*6);
    }
    // flickering hallway light
    const fOn=(Math.sin(time*7.3)+Math.sin(time*13.1)+Math.sin(time*2.1))>1.3 || (time%6<.08);
    flickMat.emissiveIntensity=fOn?2.6:.08; flickLight.intensity=fOn?6:0;
    vendMat.emissiveIntensity=1.4+Math.sin(time*40)*.02;

    // dark hour
    dark+=(darkT-dark)*Math.min(1,dt*2);
    scene.fog.color.copy(FOG_N).lerp(FOG_D,dark);
    moonL.color.copy(MOON_N).lerp(MOON_D,dark);
    moonMat.color.setRGB(2.0+dark*.4,2.15+dark*.5,2.5-dark*1.4);
    haloMat.color.setRGB(.35+dark*.2,.6+dark*.6,1.3-dark*.9);
    sky.material.uniforms.hor.value.setRGB(.055-dark*.02,.184-dark*.06,.408-dark*.33);
    beamMat.uniforms.color.value.setRGB(.55+dark*.05,.75+dark*.2,1.0-dark*.45);

    // picking hover
    if (ptr.dirty){ ptr.dirty=false; const s=pickAt(ptr.cx,ptr.cy); if (s!==hoverSec){ hoverSec=s; canvas.style.cursor=s?'pointer':''; } showTip(hoverSec,ptr.cx,ptr.cy); }

    // uniforms + render
    sky.material.uniforms.time.value=time; beamMat.uniforms.time.value=time; dustMat.uniforms.time.value=time;
    glitch=Math.max(0,glitch-dt*3.2);
    finalPass.uniforms.time.value=time; finalPass.uniforms.dark.value=dark; finalPass.uniforms.glitch.value=glitch;
    if (fxOn) composer.render(); else renderer.render(scene,camera);
  }

  renderer.compile(scene,camera);
  progress(.97);
  goTo('home', RM?.01:2.8);
  frame();
  return { goTo, peek, setDark, setFx };
}
</script>
