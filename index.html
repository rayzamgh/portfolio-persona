<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rayza Mahendra — Portfolio</title>
<meta name="description" content="Rayza Mahendra: AI & Data Governance CoE Officer and ML Engineer at Telkomsel, Jakarta.">
<meta name="theme-color" content="#011021">
<meta property="og:title" content="Rayza Mahendra — Portfolio">
<meta property="og:description" content="AI & Data Governance · LLMOps · GenAI · NLP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00aaff; --cyan-hi:#5fd0ff; --ink:#011021; --navy:#02142b; --white:#f2f8ff; --muted:#8fb0d4; --line:rgba(0,170,255,.35);
  --gold:#ffcc4d; --pink:#ff3d6e;
  --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--white);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.no-gl{background:radial-gradient(120% 90% at 30% 30%,#06306a 0,#011021 55%,#000 100%)}
button{font:inherit;color:inherit}
a{color:var(--cyan-hi)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.75)}

/* ---------- logo (top right, from the original) ---------- */
#logo{position:fixed;z-index:5;top:2rem;right:3rem;text-align:right;pointer-events:none;transition:opacity .3s,transform .4s var(--out)}
#logo .nm{display:block;font-weight:900;font-size:3rem;line-height:.95;letter-spacing:-.02em;transform:skewX(-10deg);text-shadow:0 4px 24px rgba(0,0,0,.6)}
#logo .pf{display:inline-block;margin-top:.35rem;background:var(--cyan);color:var(--ink);font-weight:900;font-size:1.25rem;letter-spacing:.12em;padding:.2rem 1rem;transform:skewX(-10deg)}
#logo .rl{display:block;margin-top:.6rem;font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan-hi);transform:skewX(-10deg)}

/* ---------- menu (bottom right, 3 items) ---------- */
#menu{position:fixed;z-index:5;right:3rem;bottom:3.2rem}
#menu ul{list-style:none;margin:0;padding:0;text-align:right}
#menu li{margin:.35rem 0;opacity:0;transform:translateX(60px);transition:opacity .4s,transform .6s var(--out);transition-delay:calc(var(--i)*70ms + 150ms)}
body.ready #menu li{opacity:1;transform:none}
.mi{position:relative;display:inline-flex;align-items:baseline;gap:.9rem;background:none;border:0;cursor:pointer;padding:.2rem 2rem .25rem 1.6rem;font-weight:900;font-size:2.6rem;line-height:1.05;letter-spacing:-.01em;color:var(--white);transform:skewX(-15deg);transition:color .2s,transform .25s var(--out);text-shadow:0 3px 18px rgba(0,0,0,.55)}
.mi .ix{font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--cyan-hi);transition:color .2s}
.mi::before{content:"";position:absolute;z-index:-1;inset:0;background:var(--cyan);transform:scaleX(0);transform-origin:left;transition:transform .28s var(--out)}
.mi::after{content:"";position:absolute;z-index:-2;inset:0;background:var(--white);transform:translate(7px,6px) scaleX(0);transform-origin:left;transition:transform .32s .04s var(--out)}
.mi:hover,.mi.on{color:var(--ink);text-shadow:none;transform:skewX(-15deg) translateX(-10px)}
.mi:hover .ix,.mi.on .ix{color:var(--ink)}
.mi:hover::before,.mi.on::before{transform:scaleX(1)}
.mi.on::after{transform:translate(7px,6px) scaleX(1)}
.mi:focus-visible{outline:none}
.mi:focus-visible::before{transform:scaleX(1)}
.mi:focus-visible{color:var(--ink)}

#credit{position:fixed;z-index:5;right:2rem;bottom:1rem;font-size:.75rem;color:#7f93ad;pointer-events:none}
#credit a{pointer-events:auto;color:#9fc4e8;text-decoration:none}
#credit a:hover{color:var(--cyan-hi)}

/* ---------- card (left) ---------- */
#card{position:fixed;z-index:6;left:3rem;top:50%;width:min(430px,calc(100vw - 6rem));max-height:calc(100vh - 6rem);display:flex;flex-direction:column;transform:translate(-30px,-50%);opacity:0;visibility:hidden;transition:opacity .25s,transform .45s var(--out),visibility 0s .45s}
body.open #card{opacity:1;visibility:visible;transform:translate(0,-50%);transition:opacity .25s,transform .45s var(--out)}
#card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(2,24,56,.94),rgba(1,10,26,.95));border-left:5px solid var(--cyan);transform:skewX(-6deg);box-shadow:12px 12px 0 rgba(0,170,255,.18),0 20px 60px rgba(0,0,0,.5)}
.c-head{position:relative;padding:1.6rem 1.8rem .6rem 1.9rem}
.c-tag{display:inline-block;background:var(--cyan);color:var(--ink);font-weight:900;font-size:.72rem;letter-spacing:.2em;padding:.25rem .7rem;transform:skewX(-10deg)}
.c-title{margin:.5rem 0 0;font-weight:900;font-size:2.4rem;line-height:1;letter-spacing:-.02em;transform:skewX(-10deg);transform-origin:left;outline:none}
.c-x{position:absolute;top:1.2rem;right:1.2rem;width:34px;height:34px;display:grid;place-items:center;background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:15px;transform:skewX(-10deg);transition:.15s}
.c-x:hover{background:var(--white);color:var(--ink);border-color:var(--white)}
.c-body{padding:.6rem 1.9rem 1.7rem 2.1rem;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.c-body.anim>*{animation:up .4s var(--out) both;animation-delay:calc(var(--d,0)*55ms + 80ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.c-body p{margin:0 0 .9rem;font-size:.95rem;line-height:1.6;color:#c9daee}
.role{font-weight:700;font-size:1rem;color:var(--white)!important;margin-bottom:.4rem!important}
.role span{color:var(--cyan-hi)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.2rem 0 1rem}
.st{padding:.7rem .7rem .6rem;border:1px solid var(--line);background:rgba(0,170,255,.06);transform:skewX(-6deg)}
.st b{display:block;font-weight:900;font-size:1.55rem;line-height:1;color:var(--cyan-hi)}
.st span{display:block;margin-top:.3rem;font-size:.7rem;line-height:1.3;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:.35rem}
.tags span{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .6rem;border:1px solid var(--line);color:#d6ecff;transform:skewX(-10deg)}
.pj{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;padding:.75rem 0;border-bottom:1px solid rgba(0,170,255,.16)}
.pj:last-of-type{border-bottom:0}
.pj .n{grid-row:span 2;font-weight:900;font-size:1.1rem;color:var(--cyan);transform:skewX(-10deg);padding-top:.05rem}
.pj b{font-weight:900;font-size:1.05rem;letter-spacing:-.01em}
.pj span{font-size:.86rem;line-height:1.45;color:#b9cde4}
.pj .bd{display:inline-block;margin-left:.4rem;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .4rem;background:var(--gold);color:var(--ink);transform:skewX(-10deg);vertical-align:.15rem}
.pj .bd.f{background:none;color:var(--cyan-hi);border:1px solid var(--line)}
.more{display:inline-block;margin-top:1rem;font-weight:700;font-size:.85rem;color:var(--cyan-hi);text-decoration:none}
.more:hover{color:var(--white)}
.ct{display:grid;gap:.5rem;margin-top:.3rem}
.ct a{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1rem;border:1px solid var(--line);text-decoration:none;color:var(--white);transform:skewX(-6deg);transition:background .15s,color .15s,border-color .15s}
.ct a b{font-weight:900;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
.ct a span{font-size:.85rem;color:var(--muted)}
.ct a:hover{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.ct a:hover span{color:var(--ink)}
.ct a.cv{background:var(--white);color:var(--ink);border-color:var(--white)}
.ct a.cv span{color:#335}
.ct a.cv:hover{background:var(--cyan);border-color:var(--cyan)}

#tip{position:fixed;z-index:8;left:0;top:0;pointer-events:none;background:var(--cyan);color:var(--ink);font-weight:900;font-size:.8rem;letter-spacing:.1em;padding:.3rem .6rem;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}

/* ---------- quality-mode button ---------- */
#hq{position:fixed;z-index:7;top:1.2rem;left:2rem;display:inline-flex;align-items:center;gap:.55rem;padding:.45rem .95rem;border:1px solid var(--line);background:rgba(1,16,33,.55);color:var(--cyan-hi);font-weight:900;font-size:.7rem;letter-spacing:.16em;text-decoration:none;transform:skewX(-10deg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s,color .15s,border-color .15s,opacity .4s;opacity:0}
body.ready #hq{opacity:1}
#hq i{width:7px;height:7px;background:var(--cyan);transform:rotate(45deg);box-shadow:0 0 8px var(--cyan)}
#hq:hover,#hq:focus-visible{background:var(--cyan);color:var(--ink);border-color:var(--cyan);outline:none}
#hq:hover i,#hq:focus-visible i{background:var(--ink);box-shadow:none}

/* ---------- splash: droplet → ripples → silhouette → reveal ---------- */
#splash{position:fixed;inset:0;z-index:50;background:#000814;cursor:pointer}
#splash.gl{background:transparent}
#splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sp-t{position:absolute;left:0;right:0;bottom:16vh;text-align:center;pointer-events:none;transition:opacity .35s}
.sp-nm{display:inline-block;font-weight:900;font-size:clamp(2.1rem,6.4vw,4.6rem);line-height:1;letter-spacing:-.02em;transform:skewX(-10deg);clip-path:inset(-10% 100% -10% 0);transition:clip-path .8s var(--out);text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sp-pf{display:block;width:max-content;margin:.45rem auto 0;background:var(--cyan);color:var(--ink);font-weight:900;font-size:clamp(.8rem,1.5vw,1.05rem);letter-spacing:.16em;padding:.18rem .95rem;transform:skewX(-10deg) scaleX(0);transition:transform .55s .35s var(--out)}
.sp-bar{width:170px;height:2px;margin:1.1rem auto 0;background:rgba(0,170,255,.2);overflow:hidden;transform:skewX(-30deg)}
.sp-bar i{display:block;height:100%;background:var(--cyan);transform-origin:left;transform:scaleX(0);transition:transform .25s}
.sp-skip{position:absolute;right:1.5rem;bottom:1.2rem;font-size:.66rem;font-weight:700;letter-spacing:.2em;color:#6f86a3;opacity:0;transition:opacity .4s;pointer-events:none}
#splash.t .sp-nm{clip-path:inset(-10% -5% -10% 0)}
#splash.t .sp-pf{transform:skewX(-10deg) scaleX(1)}
#splash.t.ok .sp-skip{opacity:1}
#splash.out{pointer-events:none}
#splash.out .sp-t,#splash.t.ok.out .sp-skip{opacity:0}
#splash.fade{transition:opacity .6s;opacity:0}

/* ---------- mobile ---------- */
@media (max-width:768px){
  #logo{top:1.1rem;right:auto;left:1.2rem;text-align:left}
  #logo .nm{font-size:2rem}
  #logo .pf{font-size:.9rem}
  #logo .rl{font-size:.62rem}
  #menu{left:0;right:0;bottom:1.6rem}
  #menu ul{display:flex;justify-content:center;gap:.2rem}
  #menu li{margin:0}
  .mi{font-size:clamp(1rem,5.4vw,1.35rem);padding:.3rem .7rem;white-space:nowrap}
  .mi .ix{display:none}
  .mi:hover,.mi.on{transform:skewX(-15deg)}
  #credit{left:0;right:0;bottom:.4rem;text-align:center;font-size:.62rem}
  #hq{top:1.1rem;left:auto;right:1rem;font-size:.6rem;padding:.4rem .7rem;letter-spacing:.12em}
  body.open #hq{opacity:0;pointer-events:none}
  .sp-t{bottom:20vh}
  #card{left:.8rem;right:.8rem;width:auto;top:auto;bottom:5.4rem;max-height:56vh;max-height:56dvh;transform:translateY(20px)}
  body.open #card{transform:none}
  #card::before{transform:skewX(-3deg)}
  .c-head{padding:1.2rem 1.3rem .4rem 1.5rem}
  .c-title{font-size:1.9rem}
  .c-body{padding:.4rem 1.3rem 1.3rem 1.5rem}
  body.open #logo{opacity:0;transform:translateY(-10px)}
}
@media (prefers-reduced-motion:reduce){
  #card,body.open #card,#menu li{transition:none}
  .c-body.anim>*{animation:none}
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="vignette"></div>

<header id="logo">
  <span class="nm">RAYZA MAHENDRA</span>
  <span class="pf">PORTFOLIO</span>
  <span class="rl">AI &amp; Data Governance · ML Engineer</span>
</header>

<nav id="menu" aria-label="Sections">
  <ul>
    <li style="--i:0"><button class="mi" type="button" data-id="about"><span class="ix">01</span>ABOUT ME</button></li>
    <li style="--i:1"><button class="mi" type="button" data-id="projects"><span class="ix">02</span>PROJECTS</button></li>
    <li style="--i:2"><button class="mi" type="button" data-id="contact"><span class="ix">03</span>CONTACT</button></li>
  </ul>
</nav>

<section id="card" aria-hidden="true" aria-labelledby="c-title">
  <div class="c-head">
    <span class="c-tag" id="c-tag"></span>
    <h2 class="c-title" id="c-title" tabindex="-1"></h2>
    <button class="c-x" id="c-x" type="button" aria-label="Close">✕</button>
  </div>
  <div class="c-body" id="c-body"></div>
</section>

<a id="hq" href="quality/" title="Full-effects version: bloom, film grain, a whole hallway"><i></i>QUALITY MODE</a>
<div id="credit">Inspired by Persona 3 Reload</div>
<div id="tip"></div>
<div id="splash" aria-hidden="true">
  <canvas id="sp-gl"></canvas>
  <div class="sp-t"><div class="sp-nm">RAYZA MAHENDRA</div><span class="sp-pf">PORTFOLIO</span><div class="sp-bar"><i id="boot-bar"></i></div></div>
  <div class="sp-skip">CLICK TO SKIP</div>
</div>
<noscript><p style="position:fixed;bottom:0;left:0;right:0;margin:0;padding:16px;background:#011021;z-index:99">This portfolio needs JavaScript. Rayza Mahendra · AI &amp; Data Governance CoE Officer, Telkomsel · rayzamgh@gmail.com</p></noscript>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
/* =========================================================================
   CONTENT — short on purpose. Source: Rayza's CV.
   ========================================================================= */
const CV = 'Rayza%20Mahendra%20-%20CV.pdf';
const SECTIONS = {
  about: { tag:'01 · PROFILE', title:'ABOUT ME', html:`
    <p class="role">AI &amp; Data Governance CoE Officer <span>@ Telkomsel</span></p>
    <p>I build and govern production AI. Backend engineer, then data scientist, then ML engineer and LLMOps tech lead. Now I run AI governance across Telkomsel.</p>
    <div class="stats">
      <div class="st"><b>200+</b><span>AI initiatives governed</span></div>
      <div class="st"><b>20+</b><span>AI use cases shipped</span></div>
      <div class="st"><b>M.AI</b><span>ITB, cum laude</span></div>
    </div>
    <div class="tags"><span>LLMOps</span><span>GenAI</span><span>NLP</span><span>AI Governance</span></div>` },
  projects: { tag:'02 · HIGHLIGHTS', title:'PROJECTS', html:`
    <div class="pj"><span class="n">01</span><b>Galilei<span class="bd">IDC 2025</span></b><span>LLMOps platform for agentic AI. 20+ use cases into production.</span></div>
    <div class="pj"><span class="n">02</span><b>Early Warning System<span class="bd">TM Forum 2026</span></b><span>Core AI model behind Telkomsel's award-winning EWS.</span></div>
    <div class="pj"><span class="n">03</span><b>Bank Indonesia AI</b><span>Agentic platform reading the news to gauge public response to policy.</span></div>
    <div class="pj"><span class="n">04</span><b>ACE Probing Machine<span class="bd f">Glotel finalist</span></b><span>Competitor price intelligence for Telkomsel offers.</span></div>
    <a class="more" href="${CV}" download>Everything else is in the CV ↓</a>` },
  contact: { tag:'03 · SOCIAL LINK', title:'CONTACT', html:`
    <p>Open to talks on AI governance, LLMOps and production GenAI.</p>
    <div class="ct">
      <a href="mailto:rayzamgh@gmail.com"><b>Email</b><span>rayzamgh@gmail.com</span></a>
      <a href="https://www.linkedin.com/in/rayza-mahendra-9a1595162/" target="_blank" rel="noopener"><b>LinkedIn</b><span>in/rayza-mahendra</span></a>
      <a href="https://github.com/rayzamgh" target="_blank" rel="noopener"><b>GitHub</b><span>rayzamgh</span></a>
      <a class="cv" href="${CV}" download><b>Download CV</b><span>PDF ↓</span></a>
    </div>` },
};
const ORDER = ['about','projects','contact'];

/* =========================================================================
   UI
   ========================================================================= */
const $=s=>document.querySelector(s), body=document.body;
const isMobile=()=>matchMedia('(max-width: 768px)').matches;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let world=null, current=null;
const btns=[...document.querySelectorAll('.mi')];
const cBody=$('#c-body');

function open(id,{fromHash=false}={}){
  const s=SECTIONS[id]; if (!s) return;
  if (current!==id){
    $('#c-tag').textContent=s.tag; $('#c-title').textContent=s.title;
    cBody.innerHTML=s.html; cBody.scrollTop=0;
    [...cBody.children].forEach((c,i)=>c.style.setProperty('--d',i));
    cBody.classList.remove('anim'); void cBody.offsetWidth; cBody.classList.add('anim');
    world?.goTo(id);
  }
  current=id; body.classList.add('open'); $('#card').setAttribute('aria-hidden','false');
  btns.forEach(b=>{ const on=b.dataset.id===id; b.classList.toggle('on',on); b.setAttribute('aria-current',on); });
  if (!fromHash) history.replaceState(null,'','#'+id);
}
function close(){
  if (!current) return;
  const b=btns.find(b=>b.dataset.id===current);
  current=null; body.classList.remove('open'); $('#card').setAttribute('aria-hidden','true');
  btns.forEach(b=>{ b.classList.remove('on'); b.setAttribute('aria-current','false'); });
  world?.goTo('home'); history.replaceState(null,'',location.pathname+location.search);
  b?.focus({preventScroll:true});
}
btns.forEach(b=>{
  b.addEventListener('click',()=> b.dataset.id===current ? close() : open(b.dataset.id));
  b.addEventListener('pointerenter',()=>{ if (!current) world?.peek(b.dataset.id); });
  b.addEventListener('pointerleave',()=>world?.peek(null));
});
$('#c-x').addEventListener('click',close);
addEventListener('keydown',e=>{
  if (e.altKey||e.ctrlKey||e.metaKey) return;
  if (e.key==='Escape' && current){ e.preventDefault(); close(); return; }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    const i=current?ORDER.indexOf(current):-1, d=(e.key==='ArrowUp'||e.key==='ArrowLeft')?-1:1;
    e.preventDefault(); const n=ORDER[(i+d+ORDER.length)%ORDER.length]; open(n); btns[ORDER.indexOf(n)].focus({preventScroll:true});
  }
});
addEventListener('hashchange',()=>{ const id=location.hash.slice(1); SECTIONS[id]?open(id,{fromHash:true}):close(); });

const tip=$('#tip');
function showTip(id,x,y){ if (!id){ tip.classList.remove('on'); return; } tip.textContent=SECTIONS[id].title; tip.style.transform=`translate(${x+14}px,${y+12}px) skewX(-10deg)`; tip.classList.add('on'); }

const bar=$('#boot-bar'), progress=v=>bar.style.transform=`scaleX(${Math.min(1,v)})`;
let readied=false;
function ready(){
  if (readied) return; readied=true;
  Splash.finish(()=>{
    body.classList.add('ready');
    const id=location.hash.slice(1);
    if (SECTIONS[id]) setTimeout(()=>open(id,{fromHash:true}),250); else world?.intro();
  });
}

/* ---------- splash: a droplet hits dark water, the silhouette rises through the ripples,
              then a second splash opens a ring that reveals the classroom ---------- */
const Splash=(()=>{
  const el=$('#splash'), cv=$('#sp-gl');
  const t0=performance.now(), now=()=>(performance.now()-t0)/1000;
  let gl=null, U={}, I0=[0,0,1e4], I1=[0,0,1e4], outT=-1, minT=RM?0:2.8, ok=false, cb=null, alive=true;
  const FS=`#extension GL_OES_standard_derivatives : enable
    precision highp float;
    uniform vec2 R; uniform float T,face,flash,outR,drop,has,ca; uniform vec3 I0,I1; uniform vec2 off,sc; uniform sampler2D img;
    float D(vec2 u){ return mix(-80.,(texture2D(img,clamp(u,0.,1.)).r-.5)*80.,has); } // smoothed signed distance, source px
    float rip(vec3 I,vec2 p,float amp){ float t=T-I.z; if(t<0.) return 0.; float r=length(p-I.xy), f=t*.62;
      float pk=sin((r-f)*38.)*exp(-abs(r-f)*7.), tr=sin(r*30.-t*10.)*exp(-r*1.6)*step(r,f)*.5;
      return (pk+tr)*exp(-t*.75)*amp*smoothstep(0.,.04,r); }
    float caus(vec2 p){ float c=0.; for(int i=0;i<3;i++){ p=p*1.7+vec2(sin(p.y*1.3+T*.4),cos(p.x*1.1-T*.35)); c+=abs(sin(p.x)+sin(p.y)); } return c/6.; }
    void main(){
      vec2 p=(gl_FragCoord.xy-.5*R)/R.y;

  const doors=DOORS.map(([a,b])=>{ const mat=std({map:doorTex,emissiveMap:doorGlow,emissive:0x9fc8ff,emissiveIntensity:.8,roughness:.6});
    const d=new THREE.Mesh(new THREE.BoxGeometry(.05,DH-.02,b-a),[mat,mat,M.trim,M.trim,M.trim,M.trim]); d.position.set(RX-.03,(DH-.02)/2,(a+b)/2); d.castShadow=true; scene.add(d); return d; });

  /* ---------- desks & chairs ---------- */
  const dW=[], dM=[], cW=[], cM=[];
  { const b=(arr,w,h,d,x,y,z)=>{ const g=new THREE.BoxGeometry(w,h,d); g.translate(x,y,z); arr.push(g); };
    b(dW,.64,.035,.46,0,.74,0); b(dM,.56,.1,.38,0,.64,-.02);
    for (const sx of [-1,1]) for (const sz of [-1,1]) b(dM,.03,.72,.03,sx*.28,.36,sz*.19);
    b(cW,.4,.03,.4,0,.44,0); b(cW,.38,.28,.03,0,.74,.19);
    for (const sx of [-1,1]) for (const sz of [-1,1]) b(cM,.025,.43,.025,sx*.17,.215,sz*.17);
    for (const sx of [-1,1]) b(cM,.025,.42,.025,sx*.17,.66,.19); }
  const deskPos=[];
  for (const x of [-3.6,-1.8,0,1.8,3.6]) for (const z of [-2.5,-1.15,.2,1.55,2.9]) deskPos.push([x+rr(-.05,.05),z+rr(-.05,.05)]);
  const mk=(geos,mat,n)=>{ const m=new THREE.InstancedMesh(mergeGeometries(geos),mat,n); m.castShadow=m.receiveShadow=true; scene.add(m); return m; };
  const iDW=mk(dW,M.desk,deskPos.length), iDM=mk(dM,M.metal,deskPos.length), iCW=mk(cW,M.desk,deskPos.length), iCM=mk(cM,M.metal,deskPos.length);
  const bags=new THREE.InstancedMesh(new THREE.BoxGeometry(.3,.24,.1),std({roughness:.8}),deskPos.length); bags.castShadow=true; scene.add(bags);
  { const m=new THREE.Matrix4(), q=new THREE.Quaternion(), one=V(1,1,1), cols=[0x1d3a6b,0x2b2b38,0x8a2a3b,0x30507a,0x403525]; let nb=0;
    deskPos.forEach(([x,z],i)=>{
      const r=rr(-.04,.04); q.setFromAxisAngle(UP,r);
      m.compose(V(x,0,z),q,one); iDW.setMatrixAt(i,m); iDM.setMatrixAt(i,m);
      const pulled=R()<.3, cr=pulled?rr(-.45,.45):rr(-.06,.06); q.setFromAxisAngle(UP,cr);
      m.compose(V(x+(pulled?rr(-.12,.12):0),0,z+.52+(pulled?rr(.12,.3):0)),q,one); iCW.setMatrixAt(i,m); iCM.setMatrixAt(i,m);
      if (R()<.45){ q.setFromAxisAngle(UP,Math.PI/2); m.compose(V(x+.34,.56,z),q,one); bags.setMatrixAt(nb,m); bags.setColorAt(nb,new THREE.Color(cols[nb%cols.length])); nb++; }
    });
    bags.count=nb; }

  // merge everything static
  for (const [mat,geos] of STATIC){ const mesh=new THREE.Mesh(mergeGeometries(geos),mat); mesh.castShadow=mesh.receiveShadow=true; scene.add(mesh); }
  scene.add(new THREE.Mesh(mergeGeometries(glassG),M.glass));
  progress(.72);

  /* ---------- outside ---------- */
  const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false, uniforms:{ md:{value:moonDir}, t:{value:0} },
    vertexShader:'varying vec3 v; void main(){ v=normalize(position); vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position=p.xyww; }',
    fragmentShader:`uniform vec3 md; uniform float t; varying vec3 v;
      float h(vec3 p){ p=fract(p*.3183+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      void main(){ vec3 d=normalize(v); vec3 c=mix(vec3(.04,.15,.36),vec3(.004,.012,.04),smoothstep(-.05,.6,d.y));
        float m=max(dot(d,md),0.); c+=vec3(.2,.4,.85)*(pow(m,10.)*.35+pow(m,80.)*.6);
        float s=h(floor(d*380.)); c+=vec3(.85,.92,1.2)*smoothstep(.9972,1.,s)*smoothstep(0.,.2,d.y)*(.6+.4*sin(t*1.5+s*70.))*1.6;
        gl_FragColor=vec4(c,1.); }` }));
  sky.renderOrder=-1; scene.add(sky);
  const moonPos=moonDir.clone().multiplyScalar(380);
  { const m=new THREE.Mesh(new THREE.SphereGeometry(13,32,16),new THREE.MeshBasicMaterial({color:new THREE.Color(1.7,1.8,2.05),fog:false})); m.position.copy(moonPos); scene.add(m);
    const h=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:new THREE.Color(.45,.65,1.2),blending:THREE.AdditiveBlending,depthWrite:false,fog:false})); h.position.copy(moonPos); h.scale.setScalar(150); scene.add(h); }
  { const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),std({color:0x02060f,roughness:1})); g.rotation.x=-Math.PI/2; g.position.y=-7; scene.add(g); }
  { const N=110, geo=new THREE.BoxGeometry(1,1,1); geo.translate(0,.5,0);
    const winT=ctex(64,128,(g,w,h)=>{ g.fillStyle='#000'; g.fillRect(0,0,w,h); for (let y=4;y<h;y+=7) for (let x=4;x<w;x+=7) if (R()<.2){ g.fillStyle=R()<.7?'#ffd696':'#9fd0ff'; g.fillRect(x,y,3,4); } });
    const city=new THREE.InstancedMesh(geo,std({color:0x050c1a,roughness:1,emissive:0xffffff,emissiveMap:winT,emissiveIntensity:.55}),N); const m=new THREE.Matrix4();
    for (let i=0;i<N;i++){ const x=rr(-260,-45), z=rr(-260,140), dist=Math.hypot(x,z); m.compose(V(x,-7,z),new THREE.Quaternion(),V(rr(8,20),rr(8,Math.min(60,dist*.2+6)),rr(8,20))); city.setMatrixAt(i,m); }
    scene.add(city); }
  { const N=26, geo=new THREE.ConeGeometry(1,1,7); geo.translate(0,.5,0); const t=new THREE.InstancedMesh(geo,std({color:0x020711,roughness:1}),N), m=new THREE.Matrix4();
    for (let i=0;i<N;i++) { m.compose(V(rr(-28,-10),-7,rr(-30,24)),new THREE.Quaternion(),V(rr(2,3.2),rr(8,12),rr(2,3.2))); t.setMatrixAt(i,m); } scene.add(t); }

  /* ---------- light ---------- */
  scene.add(new THREE.HemisphereLight(0x3a78c8,0x14284a,1.5));
  scene.add(new THREE.AmbientLight(0x005f99,.6));
  const moonL=new THREE.DirectionalLight(0xa8c8ff,3.6);
  moonL.target.position.set(0,0,0); moonL.position.copy(moonDir).multiplyScalar(30);
  moonL.castShadow=true; Object.assign(moonL.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:5,far:60});
  moonL.shadow.mapSize.set(2048,2048); moonL.shadow.bias=-.0004; moonL.shadow.normalBias=.03; scene.add(moonL,moonL.target);
  const hallL=new THREE.PointLight(0x9fc8ff,4,7,2); hallL.position.set(RX+.6,2,0); scene.add(hallL);

  /* ---------- moonbeams: one soft additive mesh ---------- */
  { const pos=[], fade=[]; const quad=(a,b,c,d,f)=>{ for (const [p,x] of [[a,f[0]],[b,f[1]],[c,f[2]],[a,f[0]],[c,f[2]],[d,f[3]]]){ pos.push(p.x,p.y,p.z); fade.push(x); } };
    const hit=c=>{ const tf=-c.y/L.y, tw=(RX-c.x)/L.x, tz=(RZ-c.z)/L.z; return c.clone().addScaledVector(L,Math.min(tf,tw,tz)); };
    for (const [a,b] of WINS){ const n=[V(-RX,SILL+.05,a+.05),V(-RX,SILL+.05,b-.05),V(-RX,HEAD-.05,b-.05),V(-RX,HEAD-.05,a+.05)], f=n.map(hit);
      for (let i=0;i<4;i++){ const j=(i+1)%4; quad(n[i],n[j],f[j],f[i],[1,1,0,0]); } }
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('aF',new THREE.Float32BufferAttribute(fade,1)); geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo,new THREE.ShaderMaterial({ transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
      vertexShader:'attribute float aF; varying float f; varying vec3 n,vv; void main(){ f=aF; vec4 w=modelMatrix*vec4(position,1.); n=normalize(mat3(modelMatrix)*normal); vv=normalize(cameraPosition-w.xyz); gl_Position=projectionMatrix*viewMatrix*w; }',
      fragmentShader:'varying float f; varying vec3 n,vv; void main(){ float a=pow(f,1.5)*pow(abs(dot(normalize(n),normalize(vv))),1.4)*.05; gl_FragColor=vec4(vec3(.55,.75,1.)*a,1.); }' }))); }

  /* ---------- characters ---------- */
  const loader=new THREE.TextureLoader();
  // Sprites are smoothed signed-distance fields (built from images/charN.png): r = .5 + d/80, d in source px (+ inside), 44px padding.
  const SDF_PAD=44;
  const DEF=[ {url:'images/char1-sdf.png',pos:V(-4.95,0,1.4),h:1.76,sec:'about'}, {url:'images/char2-sdf.png',pos:V(-2.75,0,-3.2),h:1.62,sec:'contact'}, {url:'images/char3-sdf.png',pos:V(-.9,0,-3.05),h:1.79,sec:'contact'} ];
  const texs=await Promise.all(DEF.map(c=>new Promise(r=>loader.load(c.url,r,undefined,()=>r(null)))));
  progress(.9);
  const chars=[];
  const poolTex=ctex(128,128,(g)=>{ const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(0,170,255,.9)'); gr.addColorStop(.45,'rgba(0,170,255,.3)'); gr.addColorStop(1,'rgba(0,170,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); });
  DEF.forEach((c,i)=>{ const t=texs[i]; if (!t) return; const img=t.image, s=c.h/(img.height-2*SDF_PAD);
    const geo=new THREE.PlaneGeometry(img.width*s,img.height*s); geo.translate(0,img.height*s/2-SDF_PAD*s,0);
    const mat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, fog:false,
      uniforms:{ map:{value:t}, glow:{value:1}, t:{value:0}, ph:{value:i*2.1}, padV:{value:SDF_PAD/img.height} },
      vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader:`uniform sampler2D map; uniform float glow,t,ph,padV; varying vec2 vUv;
        void main(){
          float d=(texture2D(map,vUv).r-.5)*80.;              // signed distance to the edge, in source pixels
          float aa=max(fwidth(d)*.75,.02);
          float pulse=.88+.12*sin(t*1.6+ph);
          vec3 cy=vec3(0.,.67,1.);
          float inside=smoothstep(-aa,aa,d);
          float outer=smoothstep(-6.-aa,-6.+aa,d);              // outline = 6px band hugging the shape
          float rim=outer-inside;
          float halo=exp(-max(-d-6.,0.)/9.)*(1.-outer)*.42*glow*pulse;
          float by=clamp((vUv.y-padV)/(1.-2.*padV),0.,1.);
          vec3 fill=mix(vec3(.02,.06,.16),vec3(.04,.14,.3),smoothstep(.2,1.,by))+cy*(.10+.35*exp(-d/3.))*pulse;
          vec3 col=mix(fill,cy*2.6*glow*pulse,rim/max(outer,1e-4));
          float al=outer, oa=al+halo*(1.-al);
          if (oa<.01) discard;
          gl_FragColor=vec4((col*al+cy*1.3*glow*halo*(1.-al))/oa,oa); }` });
    const mesh=new THREE.Mesh(geo,mat); mesh.position.copy(c.pos); mesh.renderOrder=2; scene.add(mesh);
    const blob=new THREE.Mesh(new THREE.PlaneGeometry(1,.55),new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false})); blob.rotation.x=-Math.PI/2; blob.position.set(c.pos.x,.012,c.pos.z); scene.add(blob);
    const pool=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),new THREE.MeshBasicMaterial({map:poolTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.55})); pool.rotation.x=-Math.PI/2; pool.position.set(c.pos.x,.016,c.pos.z); scene.add(pool);
    chars.push({mesh,mat,pool,sec:c.sec}); });

  /* ---------- dust in the moonlight ---------- */
  const DN=mobile?250:500, dg=new THREE.BufferGeometry(), dp=new Float32Array(DN*3), ds=new Float32Array(DN);
  for (let i=0;i<DN;i++){ dp[i*3]=rr(-5.8,3); dp[i*3+1]=rr(.2,3.2); dp[i*3+2]=rr(-4.8,4.8); ds[i]=R(); }
  dg.setAttribute('position',new THREE.BufferAttribute(dp,3)); dg.setAttribute('s',new THREE.BufferAttribute(ds,1));
  const dustMat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, uniforms:{ t:{value:0}, k:{value:H*DPR*.5} },
    vertexShader:'attribute float s; uniform float t,k; varying float a; void main(){ vec3 p=position+vec3(sin(t*.15+s*30.)*.3,sin(t*.11+s*12.)*.2,cos(t*.13+s*21.)*.3); vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv; gl_PointSize=(.012+s*.016)*k/-mv.z; a=.35+.3*sin(t+s*50.); }',
    fragmentShader:'varying float a; void main(){ float d=length(gl_PointCoord-.5); float o=smoothstep(.5,0.,d)*a; if(o<.01) discard; gl_FragColor=vec4(vec3(.7,.85,1.1)*o,1.); }' });
  scene.add(new THREE.Points(dg,dustMat));

  /* ---------- camera ---------- */
  const VIEWS={
    home:{ pos:V(4.1,1.78,4.5), look:V(-1.6,1.25,-3.2) },
    about:{ pos:V(-2.3,1.5,3.3), look:V(-5.6,1.45,-.2) },
    projects:{ pos:V(1.0,1.68,1.9), look:V(.5,1.5,-RZ) },
    contact:{ pos:V(.9,1.58,.3), look:V(-2.1,1.15,-3.3) },
  };
  if (W<H) VIEWS.home.look=V(-2.2,1.2,-.4); // portrait: swing left so all three figures are in frame
  const m4=new THREE.Matrix4(), qLook=(e,t,o=new THREE.Quaternion())=>o.setFromRotationMatrix(m4.lookAt(e,t,UP));
  const cur={ pos:V(5,2.3,4.8), quat:qLook(V(5,2.3,4.8),VIEWS.home.look) };
  let view='home', peekId=null, mv=null;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function goTo(id,{dur}={}){
    const v=VIEWS[id]; if (!v) return; view=id; peekId=null;
    const a=cur.pos.clone(), b=v.pos.clone(), mid=a.clone().lerp(b,.5); mid.y+=Math.min(.35,a.distanceTo(b)*.06);
    mv={ a, b, mid, qa:cur.quat.clone(), qb:qLook(v.pos,v.look), t:0, dur:RM?.001:(dur??THREE.MathUtils.clamp(.6+a.distanceTo(b)/9,.7,1.2)) };
  }
  const peek=id=>{ if (view==='home') peekId=id; };
  const intro=()=>goTo('home',{dur:2.4}); // plays as the splash opens

  /* ---------- picking ---------- */
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  const picks=[{o:board,s:'projects'},...doors.map(o=>({o,s:'contact'})),...chars.map(c=>({o:c.mesh,s:c.sec}))];
  const objs=picks.map(p=>p.o);
  const pickAt=(x,y)=>{ ndc.set(x/W*2-1,-(y/H)*2+1); ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(objs,false)[0]; return h?picks.find(p=>p.o===h.object).s:null; };
  let hover=null, pend=null, ptr={x:0,y:0,tx:0,ty:0};
  canvas.addEventListener('pointermove',e=>{ ptr.tx=e.clientX/W*2-1; ptr.ty=e.clientY/H*2-1; if (e.pointerType==='mouse') pend=[e.clientX,e.clientY]; });
  canvas.addEventListener('pointerleave',()=>{ hover=null; showTip(null); canvas.style.cursor=''; });
  canvas.addEventListener('click',e=>{ const s=pickAt(e.clientX,e.clientY); if (s) open(s); });

  addEventListener('resize',()=>{ W=innerWidth; H=innerHeight; renderer.setSize(W,H,false); camera.aspect=W/H; camera.fov=W<H?80:55; camera.updateProjectionMatrix(); dustMat.uniforms.k.value=H*DPR*.5; });

  /* keep the subject in the part of the screen the card doesn't cover */
  const card=$('#card');
  function focus(){
    if (!body.classList.contains('open')) return [0,0];
    if (isMobile()){ const top=card.getBoundingClientRect().top; return [0,top/2-H/2+20]; }
    const right=card.getBoundingClientRect().right+30, menuL=W-330; return [(right+menuL)/2-W/2,0];
  }
  const vo={x:0,y:0}, tq=new THREE.Quaternion(), pq=new THREE.Quaternion(), eu=new THREE.Euler(), tv=new THREE.Vector3();
  const clock=new THREE.Clock(); let time=0;
  function frame(){
    requestAnimationFrame(frame);
    const dt=Math.min(clock.getDelta(),.05); time+=dt;
    if (mv){ mv.t=Math.min(1,mv.t+dt/mv.dur); const e=ease(mv.t), u=1-e;
      cur.pos.set(u*u*mv.a.x+2*u*e*mv.mid.x+e*e*mv.b.x, u*u*mv.a.y+2*u*e*mv.mid.y+e*e*mv.b.y, u*u*mv.a.z+2*u*e*mv.mid.z+e*e*mv.b.z);
      cur.quat.copy(mv.qa).slerp(mv.qb,e); if (mv.t>=1) mv=null; }
    else { let lp=VIEWS[view].look; if (view==='home' && peekId) lp=tv.copy(lp).lerp(VIEWS[peekId].look,.25); qLook(cur.pos,lp,tq); cur.quat.slerp(tq,1-Math.exp(-dt*4)); }
    ptr.x+=(ptr.tx-ptr.x)*Math.min(1,dt*2.5); ptr.y+=(ptr.ty-ptr.y)*Math.min(1,dt*2.5);
    camera.position.copy(cur.pos); camera.position.y+=Math.sin(time*.7)*.006;
    camera.quaternion.copy(cur.quat).multiply(pq.setFromEuler(eu.set(-ptr.y*.018,-ptr.x*.03,0)));
    const [fx,fy]=focus(), k=1-Math.exp(-dt*7); vo.x+=(fx-vo.x)*k; vo.y+=(fy-vo.y)*k; camera.setViewOffset(W,H,-vo.x,-vo.y,W,H);
    curtains.forEach((c,i)=>{ c.rotation.x=Math.sin(time*.8+i*1.7)*.035; c.rotation.z=Math.sin(time*.6+i)*.02; });
    chars.forEach(c=>{ c.mesh.rotation.y=Math.atan2(camera.position.x-c.mesh.position.x,camera.position.z-c.mesh.position.z);
      const g=(hover===c.sec||peekId===c.sec?1.45:1)+(view===c.sec?.25:0); c.mat.uniforms.glow.value+=(g-c.mat.uniforms.glow.value)*.15;
      c.mat.uniforms.t.value=time; c.pool.material.opacity=.4+.25*(c.mat.uniforms.glow.value-1)+.08*Math.sin(time*1.6); });
    sky.material.uniforms.t.value=time; dustMat.uniforms.t.value=time;
    if (pend){ const [x,y]=pend; pend=null; const s=pickAt(x,y); if (s!==hover){ hover=s; canvas.style.cursor=s?'pointer':''; } showTip(hover,x,y); }
    renderer.render(scene,camera);
  }
  renderer.compile(scene,camera); progress(1); frame();
  return { goTo, peek, intro };
}
</script>
